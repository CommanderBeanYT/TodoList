<!DOCTYPE html>
<html lang="en">
<head>
    <script src="{{ url_for('static', filename='/script.js') }}"></script>
    <meta charset="UTF-8">
    <title>Todo list</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icon.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div>
                <h1><strong>Todo</strong></h1>
                <form id="new-task" method="POST">
                    <label for="title">Title:</label>
                    <input id="title" name="title" type="text" class="form-control" placeholder="Finish Homework" required="required">

                    <label for="description">Short description:</label>
                    <input id="description" name="description" type="text" class="form-control" placeholder="Read chapter 3 and answer up to question 5">

                    <label for="due-date">Due Date:</label>
                    <input id="due-date" class="form-control col-md-2" type="datetime-local">

                    <input type="hidden" id="real-due-date" name="real-due-date">

                    <button type="submit">Add</button>
                </form>
                {% if list.length == 0 %}
                    <h2>Nothing here.</h2>
                    <h3>Either everything is done or something is very wrong</h3>
                {% else %}
                    <button id="archive-all" class="btn btn-outline-danger btn-sm">Archive Completed</button>
                    <!--Normal Version-->
                    {% for task in list %}
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center">
                                <input id={{ task.id }} class="checkbox" type="checkbox" {% if task.completed %}checked{% endif %}>
                                <div>
                                    <h2>{{ task.title }}</h2>
                                    <p><i>{{ task.description }}</i></p>
                                    {% if task.due_date != None %}<p><strong><span class="countdown" data-due="{{ task.due_date }}">Calculating...</span></strong></p>{% endif %}
                                </div>
                            </div>
                            <button id={{ task.id }} class="btn btn-outline-danger btn-sm remove">Archive</button>
                        </div>
                    {% endfor %}
