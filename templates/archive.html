<!DOCTYPE html>
<html lang="en">
<head>
    <script src="{{ url_for('static', filename='/archive.js') }}"></script>
    <meta charset="UTF-8">
    <title>Archived Tasks</title>
    <!--<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div>
                <h1><strong>Archive</strong></h1>
                {% if list.length == 0 %}
                    <h2>Nothing here.</h2>
                    <h3>Either nothing has been done or something is very wrong</h3>
                {% else %}
                    {% for task in list %}
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center">
                                <!--<input id={{ task.id }} class="checkbox" type="checkbox" {% if task.completed %}checked{% endif %}>-->
                                <div class="inline-container">
                                    <h4>{{ task.title }}</h4>
                                    <p><i>{{ task.description }}</i></p>
                                    {% if task.archived_at != None %}<p><strong><span class="countdown" data-due="{{ task.archived_at }}">Calculating...</span></strong></p>{% endif %}
                                </div>
                            </div>
                            <button id={{ task.id }} class="btn btn-sm restore">Restore</button>
                            <!--<div class="d-flex">
                                <p><i>3 days</i></p>
                                <button id={{ task.id }} class="btn btn-outline-danger btn-sm remove">-</button>
                            </div>-->
                        </div>
                    {% endfor %}
                {% endif %}
                <a href="{{ url_for('index') }}">Return</a>
            </div>
        </div>
    </div>
</body>
</html>
